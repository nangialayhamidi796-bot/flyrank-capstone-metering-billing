name: usage-metering-billing-engine

run: uvicorn app.main:app --host 0.0.0.0 --port 8000
seed: python -m app.seed
test: pytest -q
base_url: http://localhost:8000

endpoints:
  health:
    method: GET
    path: /health

  create_tenant:
    method: POST
    path: /tenants

  generate:
    method: POST
    path: /generate
    required_headers:
      - Idempotency-Key

  usage:
    method: GET
    path: /usage/{tenant_id}

  checkout:
    method: POST
    path: /checkout/{tenant_id}

  stripe_webhook:
    method: POST
    path: /webhooks/stripe